name: release

on:
  release:
    types: [created]
  # So a publish can be rehearsed without cutting a release; the dry run is the default, and the
  # real publish needs the input set deliberately.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io (otherwise dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # luna ships as two crates, not as a binary, so a release is a crates.io publish. The gate runs
  # first: a version that fails `make verify` must not reach the registry, where it cannot be taken
  # back — a yanked version still holds its number forever.
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Verify
        run: make verify
      # The tag decides the version, so a tag that disagrees with Cargo.toml is a packaging mistake
      # caught here rather than a wrong number on the registry.
      - name: Tag matches the declared version
        if: github.event_name == 'release'
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag '$tag' does not match Cargo.toml version '$declared'"
            exit 1
          fi
          echo "publishing $(make -s print-name) $declared"
      - name: Package check
        run: |
          cargo package -p "$(make -s print-name)" --allow-dirty
      - name: Publish
        if: github.event_name == 'release' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish
