[workspace]
resolver = "2"
members = [
    "util",
]
default-members = [
    ".",
    "util",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Trim Bresilla <kushtrimbresilla@gmail.com>"]
license = "MIT"
repository = "https://github.com/onix-os/luna"

[workspace.dependencies]
ahash = "0.8"
allocator-api2 = "0.2"
anyhow = "1.0"
ottavino-gc-arena = { version = "0.6.0", features = ["allocator-api2", "hashbrown"] }
hashbrown = { version = "0.14", features = ["raw"] }
# `math.random` runs on SmallRng and nothing else. The default features pull rand_chacha and
# ppv-lite86 for a ChaCha generator that is never constructed — and so does `std`, which in
# rand 0.8 enables `rand_chacha/std` rather than the optional-dependency form. `getrandom` is
# what `from_entropy` actually needs.
rand = { version = "0.8", default-features = false, features = ["small_rng", "getrandom"] }
serde = "1.0"
serde_json = "1.0"
thiserror = "1.0"

luna = { path = "./", version = "0.4.0" }

[package]
name = "luna"
description = "A stackless Lua interpreter, with an extended standard library."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ahash.workspace = true
allocator-api2.workspace = true
anyhow.workspace = true
ottavino-gc-arena.workspace = true
hashbrown.workspace = true
rand.workspace = true
thiserror.workspace = true

[[example]]
name = "async"
required-features = ["async"]

[features]
default = []
# Lets a callback `.await` a foreign future — a timer, a socket, anything with a `Future` impl.
# Off by default because it adds API surface, not because it costs dependencies: the whole
# implementation is `std::task`, and choosing a runtime stays the embedder's decision.
async = []

[dev-dependencies]
# Only the REPL example needs a dependency, and only for line editing and history. Argument
# parsing is one flag and one positional, done by hand rather than by pulling clap's dozen crates
# into every `cargo test`.
rustyline = "14.0"

# Defaults leave a release build with 16 codegen units, no cross-crate inlining and full debug
# symbols. This is a library, so these apply only to what is built *here* — examples, tests and
# the REPL — not to anything downstream.
[profile.release]
# Cuts a `Lua::core()` embed from ~794 KB to ~600 KB for about 19% off the VM's speed. Not "z",
# which saves a further 43 KB but runs 2.4x slower: `run_vm` is one large dispatch loop and "z"
# disables the inlining it depends on. See the README's "Binary size" section.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
