[package]
name = "luna-util"
description = "Utilities for the `luna` library"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true
ottavino-gc-arena.workspace = true
luna.workspace = true

[dev-dependencies]
# Dev-only, so it never reaches a consumer: a concrete serde backend to test `SerializeValue`
# against, since "serializes into any format" is not testable without one.
serde_json.workspace = true

[features]
default = ["serde"]
